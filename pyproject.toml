[project]
name = "pihive"
version = "0.1.0"
description = "Local LLM inference on a Raspberry Pi cluster with a cascade router to the cloud"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx2[http2]>=2.0",
    "pydantic-settings>=2.0",
    "solders>=0.29",
    "sentry-sdk>=2.35",
    "solana>=0.40",
    "cachetools>=7.2.0",
    "orjson>=3.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "ansible-core>=2.16",
    "pytest-asyncio>=1.4.0",
    "asgi-lifespan>=2.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["router", "cluster/supervisor", "cluster/tools", "cluster/agent"]
addopts = "-q -p no:warnings"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
