[package]
name = "cluster_attest"
version = "0.1.0"
edition = "2021"
description = "On-chain control-plane record for the Pi inference cluster"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Link the crate as a plain library (tests, client tooling) without the BPF entrypoint symbol.
no-entrypoint = []
# Declared so `entrypoint!`'s cfg checks resolve (solana-program-entrypoint docs); leave them off.
custom-heap = []
custom-panic = []

[dependencies]
borsh = { version = "1", features = ["derive"] }
solana-program = "5"
solana-system-interface = { version = "3", features = ["bincode"] }

[dev-dependencies]
# Runs the compiled .so through the real Agave program runtime. solana-program 5.0 needs the
# Agave 4.3 SDK crates, and this prerelease is the only mollusk on crates.io built for Agave 4.3
# (0.15.1 targets 4.2, whose InvokeContext API differs).
mollusk-svm = "=0.15.0-agave-4.3.0-beta.0"
solana-account = "4"
solana-instruction = "3"

[profile.release]
overflow-checks = true

[lints.rust]
# `entrypoint!` expands `cfg(target_os = "solana")` into this crate; tell check-cfg that value is real.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
