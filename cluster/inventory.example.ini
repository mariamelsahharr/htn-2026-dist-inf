# [workers] order = the supervisor's priority order: best-cooled / biggest-RAM first.
# ansible_host is how Ansible reaches a node; cluster_ip is its wired cluster address when
# that differs (hotspot door, ProxyJump). The wired IPs are what the root uses for --workers.
# To grow the cluster add pi-node-6..9 here (both groups) and rerun bootstrap.yml.
# pi-node-5 hosts the router: never in any group here.
[cluster]
pi-node-1 ansible_host=192.168.50.11
pi-node-2 ansible_host=192.168.50.12
pi-node-3 ansible_host=192.168.50.10
pi-node-4 ansible_host=192.168.50.14

[root]
pi-node-3

[workers]
pi-node-1
pi-node-2
pi-node-4

[all:vars]
ansible_user=pi
